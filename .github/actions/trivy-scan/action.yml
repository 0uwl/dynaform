name: Trivy scan and report
description: >
  Scan a container image for CVEs with Trivy and upload the SARIF report to
  the Security tab. Fails the job (exit-code 1) on a fixable finding at or
  above SCAN_SEVERITY. Reads SCAN_SEVERITY / SCAN_VULN_TYPE from the calling
  workflow's env -- one severity policy for every place that scans, same as
  before this was split into an action.

inputs:
  image-ref:
    description: Image reference to scan (e.g. dynaform:<sha> or ghcr.io/<repo>:latest)
    required: true
  category:
    description: >
      Code scanning category for this upload. Callers scanning the same
      conceptual image -- e.g. the PR/main build and the release build of
      that same code -- should pass the same category, so a later scan
      overwrites the earlier one instead of both sitting in the Security tab
      as separate, duplicate listings of the same findings. A caller scanning
      a genuinely different artifact (e.g. the already-published image,
      which can lag behind current source) should use its own category.
    required: true

runs:
  using: composite
  steps:
    - name: Scan image for CVEs
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: sarif
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: ${{ env.SCAN_VULN_TYPE }}
        severity: ${{ env.SCAN_SEVERITY }}
        output: 'trivy-results.sarif'
    - name: Report Trivy findings
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: ${{ inputs.category }}
