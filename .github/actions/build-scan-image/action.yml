name: Build image for scanning
description: >
  Build the amd64-only image Trivy scans. Never pushed -- loaded into the
  runner's docker daemon so Trivy can read it locally (a daemon can't hold a
  multi-platform image, which is why this is amd64-only and separate from the
  multi-arch publish build). Uses the shared dynaform gha cache scope, so a
  release build after a scanned merge is mostly cache hits.
  Callers must already have checked out the repo and run
  docker/setup-buildx-action before using this action.

runs:
  using: composite
  steps:
    - name: Build image for scanning
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Containerfile
        platforms: linux/amd64
        load: true
        tags: dynaform:${{ github.sha }}
        cache-from: type=gha,scope=dynaform
        cache-to: type=gha,scope=dynaform,mode=max
