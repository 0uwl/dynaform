version: 2
updates:
  # The action version tags in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The pins in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # The python:3.12-slim and uv image digests in Containerfile. The base is
  # how Debian security fixes reach the image, so it has the shortest cooldown.
  # Digest updates only: moving to 3.13-slim is a deliberate change of its own
  # (re-lock on the new version, update .python-version), not a
  # weekly bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
