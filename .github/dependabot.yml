version: 2
updates:
  # The SHA pins in .github/workflows/cicd.yml. Dependabot rewrites the SHA and
  # the version comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # requirements.in and the pip-compile lockfiles generated from it. If an
  # update leaves requirements-dev.txt stale, CI's lockfile check fails the
  # pull request rather than letting the two drift.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # The python:3.12-slim digest in Containerfile and Containerfile.dev. This is
  # how Debian security fixes reach the image, so it has the shortest cooldown.
  # Digest updates only: moving to 3.13-slim changes the Python the lockfiles
  # were compiled for, which is a deliberate change of its own (regenerate the
  # locks on the new version, update CI's python-version), not a weekly bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
