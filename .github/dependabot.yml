version: 2
updates:
  # The action version tags in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The pins in requirements.txt and requirements-dev.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # The python:3.12-slim digest in Containerfile. This is
  # how Debian security fixes reach the image, so it has the shortest cooldown.
  # Digest updates only: moving to 3.13-slim is a deliberate change of its own
  # (re-pin requirements on the new version, update CI's PYTHON_VERSION), not a
  # weekly bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
