name: Trivy

# Report-only: findings go to the Security tab and never fail a run.
#
# One job, one category, so every upload belongs to the same code scanning
# configuration. Each upload lands on the ref its image was built from: a pull
# request's merge ref, main, or a release tag. That matters for pull requests,
# which GitHub compares against main's configurations -- a configuration that
# only ever uploads to main (as the old scheduled scan of :latest did) is
# reported as "not found" on every pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, deliberately off the hour: on-the-hour crons queue behind
    # everybody else's and GitHub drops scheduled runs it cannot start.
    - cron: '17 6 * * 1'
  # So the weekly scan can be run on demand instead of waited for.
  workflow_dispatch:

permissions:
  contents: read

# MEDIUM is included, which is wider than the Trivy docs' example, for a reason
# specific to this app: every sandbox escape Jinja2 has shipped a fix for
# (CVE-2024-56201, CVE-2024-56326, CVE-2025-27516) is rated MEDIUM by CVSS.
# DynaForm renders user-supplied templates and its whole security model is
# SandboxedEnvironment, so a CRITICAL/HIGH-only report would hide the one bug
# class that actually breaks this app.
env:
  SCAN_SEVERITY: 'CRITICAL,HIGH,MEDIUM'
  SCAN_VULN_TYPE: 'os,library'

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      SCHEDULED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      # Code events: scan the image this commit builds. Only amd64 -- findings
      # are per-package, and both platforms install the same packages from the
      # same Containerfile.
      - if: env.SCHEDULED == 'false'
        uses: docker/setup-buildx-action@v4
      - if: env.SCHEDULED == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: dynaform:${{ github.sha }}
          cache-from: type=gha,scope=dynaform
          cache-to: type=gha,scope=dynaform,mode=max
      - if: env.SCHEDULED == 'false'
        id: built
        run: |
          echo "image=dynaform:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      # Schedule: rescan :latest for CVEs disclosed after it shipped -- what a
      # `podman pull` of dynaform.container's image is actually running.
      # The results go to the release tag the image was built from, read off
      # the OCI labels the publish job sets, and replace that tag's last scan.
      - if: env.SCHEDULED == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.SCHEDULED == 'true'
        id: published
        name: Pull the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          # Before the first release there is nothing to scan, and that is not
          # a failure.
          if ! docker pull --quiet "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::No published :latest image yet -- nothing to scan."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          label() { docker inspect --format "{{index .Config.Labels \"$1\"}}" "$IMAGE"; }
          {
            echo "exists=true"
            echo "image=$IMAGE"
            # metadata-action strips the `v` from the tag for {{version}}.
            echo "ref=refs/tags/v$(label org.opencontainers.image.version)"
            echo "sha=$(label org.opencontainers.image.revision)"
          } >> "$GITHUB_OUTPUT"

      - if: steps.built.outputs.exists == 'true' || steps.published.outputs.exists == 'true'
        name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.built.outputs.image || steps.published.outputs.image }}
          format: sarif
          exit-code: '0'
          # The Debian base always carries CVEs with no patch available yet;
          # listing them would bury the findings that can be acted on.
          ignore-unfixed: true
          vuln-type: ${{ env.SCAN_VULN_TYPE }}
          severity: ${{ env.SCAN_SEVERITY }}
          # Without this, trivy-action's SARIF formatter ignores `severity` and
          # reports every fixable finding regardless of rating.
          limit-severities-for-sarif: true
          output: 'trivy-results.sarif'
      # ref/sha are empty on code events, so the upload goes to the run's own
      # ref.
      - if: steps.built.outputs.exists == 'true' || steps.published.outputs.exists == 'true'
        name: Report Trivy findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image
          ref: ${{ steps.published.outputs.ref }}
          sha: ${{ steps.published.outputs.sha }}
