name: CI / Release

on:
  push:
    branches: [main]
    # Publishing is driven by the tag
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv reads the interpreter version from .python-version, the single
      # source of truth for both jobs and for local development. The uv
      # version is pinned to match the Containerfile's uv image.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
      # --locked fails if uv.lock is stale against pyproject.toml. ruff is
      # pinned in the dev group there; see the comment beside it.
      - run: uv sync --locked

      - name: Ruff (Python)
        run: uv run ruff check .

      - name: Containerfile linting
        uses: immanuwell/dockerfile-roast@1.7.0
        with:
          files: 'Containerfile'
          image-tag: '1.7.0'
          engine: podman
          preset: production

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true

      - run: uv sync --locked

      - name: Pytest
        run: uv run pytest -v

  publish:
    name: Publish container
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for creating the release at the end of this job.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Derives the image tags from the git tag, which metadata-action reads
      # off the ref: `v1.4.0` publishes :1.4.0 and :1.4 (the `v` is stripped
      # by {{version}}).
      #
      # latest=auto withholds :latest from a semver prerelease (v1.4.0-rc1
      # publishes :1.4.0-rc1 and nothing else)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/dynaform
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # QEMU simulates linux/arm64 which covers e.g. a 64-bit Raspberry Pi host.
      # cache-from/to: type=gha caches build layers in the Actions cache
      # and reuses whatever's still valid on the next run
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dynaform
          cache-to: type=gha,scope=dynaform,mode=max
      # Last, so that the release means "this version built and was
      # published" instead of being the thing that starts the attempt. A
      # release drafted by hand in the web UI pushes its tag, which arrives
      # here as an ordinary tag push -- hence the existence check, so that path
      # publishes the image and leaves the hand-written notes alone.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, leaving it as it is."
            exit 0
          fi
          # A semver prerelease carries a hyphen (v1.4.0-rc1) and a full
          # release never does: the same rule metadata-action applies above
          # when it decides whether :latest moves.
          flags=(--generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}"
